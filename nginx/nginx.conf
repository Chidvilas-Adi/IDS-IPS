# =============================================================
#  NGINX Configuration – Database-Driven IDS/IPS
#  Handles: HTTP→HTTPS redirect, SSL termination, API proxy,
#           GUI proxy, WebSocket (Socket.IO), rate limiting,
#           gzip compression, security headers.
# =============================================================

# ============================================================
#  Global Settings
# ============================================================
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
    use                 epoll;
    multi_accept        on;
}

http {
    # ---- Rate limiting zone (100 req/min per IP) ----
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/m;
    limit_req_zone $binary_remote_addr zone=gui_limit:10m rate=200r/m;

    upstream api_backend {
        server api:5000;
        keepalive 32;
    }

    upstream gui_backend {
        server gui:80;
        keepalive 32;
    }

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ---- Logging format ----
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log  /var/log/nginx/access.log  main;

    # ---- Performance ----
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    server_tokens      off;

    # ---- Gzip compression ----
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_buffers      16 8k;
    gzip_http_version 1.1;
    gzip_min_length   256;
    gzip_types
        application/atom+xml
        application/geo+json
        application/javascript
        application/x-javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rdf+xml
        application/rss+xml
        application/xhtml+xml
        application/xml
        font/eot
        font/otf
        font/ttf
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # ---- Proxy buffer settings ----
    proxy_buffer_size          128k;
    proxy_buffers              4 256k;
    proxy_busy_buffers_size    256k;
    proxy_read_timeout         300s;
    proxy_connect_timeout      75s;
    proxy_send_timeout         300s;

    # ---- WebSocket map ----
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ==========================================================
    #  Server 1: HTTP → HTTPS redirect
    # ==========================================================
    server {
        listen      80;
        listen      [::]:80;
        server_name _;

        # ACME challenge pass-through (Let's Encrypt)
        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host:${TLS_PUBLIC_PORT}$request_uri;
        }
    }

    # ==========================================================
    #  Server 2: HTTPS – main entry point
    # ==========================================================
    server {
        listen      443 ssl http2;
        listen      [::]:443 ssl http2;
        server_name _;

        # ---- SSL (self-signed; swap for Let's Encrypt in prod) ----
        ssl_certificate     /etc/nginx/ssl/self-signed.crt;
        ssl_certificate_key /etc/nginx/ssl/self-signed.key;

        # ---- Modern SSL hardening ----
        ssl_protocols             TLSv1.2 TLSv1.3;
        ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
        ssl_prefer_server_ciphers off;
        ssl_session_cache         shared:SSL:10m;
        ssl_session_timeout       1d;
        ssl_session_tickets       off;
        ssl_stapling              off;   # off for self-signed; enable for CA-signed
        ssl_stapling_verify       off;

        # ---- Security headers ----
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options            "SAMEORIGIN"                                  always;
        add_header X-Content-Type-Options     "nosniff"                                     always;
        add_header X-XSS-Protection           "1; mode=block"                               always;
        add_header Referrer-Policy            "strict-origin-when-cross-origin"             always;
        add_header Permissions-Policy         "camera=(), microphone=(), geolocation=()"    always;
        add_header Content-Security-Policy    "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' wss: ws:;" always;

        # ---- CORS (adjust origin in production) ----
        add_header Access-Control-Allow-Origin  "$http_origin"  always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, PATCH, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With, X-Tenant-ID" always;
        add_header Access-Control-Allow-Credentials "true" always;

        # ---- Handle OPTIONS pre-flight ----
        if ($request_method = 'OPTIONS') {
            return 204;
        }

        # ---- Client body limit ----
        client_max_body_size 64m;

        location = /health {
            proxy_pass http://api_backend/health;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ----------------------------------------------------------
        # /api/  → Flask REST API
        # ----------------------------------------------------------
        location /api/ {
            limit_req zone=api_limit burst=30 nodelay;
            limit_req_status 429;

            proxy_pass         http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        $connection_upgrade;
            proxy_cache_bypass $http_upgrade;

        }

        # ----------------------------------------------------------
        # /socket.io/  → Flask-SocketIO WebSocket
        # ----------------------------------------------------------
        location /socket.io/ {
            proxy_pass         http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "Upgrade";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_cache_bypass 1;
        }

        # ----------------------------------------------------------
        # /  → React/Next.js GUI
        # ----------------------------------------------------------
        location / {
            limit_req zone=gui_limit burst=50 nodelay;
            limit_req_status 429;

            proxy_pass         http://gui_backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        $connection_upgrade;
            proxy_cache_bypass $http_upgrade;

            # Next.js HMR websocket
            proxy_read_timeout 86400s;
        }

        # ---- Custom error pages ----
        error_page 429 /429.html;
        error_page 502 503 504 /50x.html;

        location = /50x.html {
            root /usr/share/nginx/html;
            internal;
        }

        location = /429.html {
            root /usr/share/nginx/html;
            internal;
        }
    }
}
